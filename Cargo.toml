[workspace]
resolver = "3"
members = [
    "crates/easyplay-core",
    "crates/easyplay-ui",
    "crates/easyplay",
    "crates/easyplay-init",
    "crates/easyplay-testkit",
    "crates/easyplay-chat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/easyplay/easyplay"
authors = ["Abdulrahman <mail@abdulrahman.dev>"]
publish = false

# Versions are the baseline on 2026-11-12 (ARCHITECTURE §11): the egui family is pinned
# with `=`, everything else uses caret requirements.
[workspace.dependencies]
# Workspace crates
easyplay-core = { path = "crates/easyplay-core" }
easyplay-ui = { path = "crates/easyplay-ui" }
easyplay-testkit = { path = "crates/easyplay-testkit" }

# UI
eframe = { version = "=0.37.0", default-features = false, features = [
    "wgpu",
    "glow",
    "wayland",
    "x11",
    "accesskit",
    "system_fonts",
    "clipboard",
] }
egui = { version = "=0.37.0" }
egui_extras = { version = "=0.37.0", default-features = false, features = ["image", "svg"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
gilrs = { version = "0.11" }
# Only to pick winit's X11 backend before the event loop exists (eframe re-exports no hook).
winit = { version = "0.30", default-features = false, features = ["x11"] }
# Probing whether the display client libraries can be loaded (`run_gui`), safely.
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
x11-dl = "2.21"
# Desktop appearance settings through the XDG portal (`run_gui`, A11Y-004); already in the
# tree through AccessKit.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
xkbcommon-dl = "0.4"

# Core
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "1.2"
thiserror = "2.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
    "std",
    "fmt",
    "json",
    "env-filter",
    "registry",
    "ansi",
] }
tracing-appender = "0.2.3"
sha2 = "0.11"
uuid = { version = "1.16", features = ["v7", "serde"] }
rust-i18n = "4.2"
unicode-bidi = "0.3"
jiff = "0.2"
rustix = { version = "1.0", features = ["fs", "process", "pipe", "event", "system", "thread", "net", "param", "rand"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "bmp"] }
pelite = "0.10"
# Search normalisation (GAME_LIBRARY §4: NFKD, combining marks removed).
unicode-normalization = "0.1.24"
bitflags = "2.9"
smallvec = { version = "1.15", features = ["serde", "union"] }
base64 = "0.23"
# The diagnostics report archive (`diagnostics::report`); already in the tree through `png`.
flate2 = "1.1"
crossbeam-channel = "0.5.15"
parking_lot = "0.13"
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
seccompiler = "0.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# The only HTTP client (ADR-0018): `artwork::http`, rustls with webpki roots, no cookies.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# Persistence (ADR-0017): ormlite on sqlx, driven by a private current-thread runtime.
ormlite = { version = "0.25", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
    "json",
    "uuid",
] }
tokio = { version = "1.45", default-features = false, features = ["rt"] }
# Not used directly: depending on it turns on `bundled` for sqlx-sqlite's copy through feature
# unification, so SQLite is always compiled in (ADR-0017, RELEASE_STRATEGY §2.1). Keep the
# version in step with what `sqlx-sqlite` requires.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

# Binary
clap = { version = "4.5", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
    "color",
] }
anyhow = "1.0"
signal-hook = "0.4"
clap_mangen = "0.2"
clap_complete = "4.5"

# Init shim
libc = "0.2.172"

# Development
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }
insta = { version = "1.43", features = ["json"] }
tempfile = "3.20"
proptest = "1.7"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.dev]
opt-level = 1
# Line tables keep backtraces useful while making test binaries several times smaller.
debug = "line-tables-only"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.epaint]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "debuginfo"

# Benchmarks (PERF-001): release code generation in its own directory (`target/perf`), so
# measuring never replaces the release binaries. `cargo bench --profile perf`.
[profile.perf]
inherits = "release"
debug = false

# `panic` and `lto` cannot be set per package; `cargo build --release -p easyplay-init`
# therefore uses unwinding and thin LTO. Packaging scripts that want the fully specified
# shim profile (ARCHITECTURE §12) build with `--profile init-release`.
[profile.release.package.easyplay-init]
opt-level = "s"
codegen-units = 1

[profile.init-release]
inherits = "release"
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
