name: CI

# Quality gates of TESTING_STRATEGY §11 that are not part of the release pipeline
# (build-release.yml runs format, clippy, the workspace tests and the release build):
# architecture rules, MSRV, the
# end-to-end suites under real bubblewrap, fuzz targets, benchmarks and coverage.

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    # Nightly: coverage and the benchmark run on the default branch.
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # rusty_ffmpeg generates its bindings from the first include folder pkg-config reports, in
  # no set order; on Ubuntu that is sometimes not the one holding FFmpeg's headers.
  FFMPEG_INCLUDE_DIR: /usr/include/x86_64-linux-gnu
  # Line tables keep backtraces useful while making test binaries several times smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  architecture:
    name: Architecture rules and formatting (ARCH-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Layering, UI imports, unsafe, colours, screen strings
        run: scripts/ci/check-architecture.sh
      # The release build checks formatting too; finding it here keeps a release from failing.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Formatting
        run: cargo fmt --all --check

  msrv:
    name: MSRV 1.95 (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev libopus-dev libpulse-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev
          # bindgen must load the libclang installed above: the runner image ships other LLVM
          # versions whose libclang lacks its headers, which leaves FFmpeg's types empty.
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang -dumpversion | cut -d. -f1)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(clang -print-resource-dir)/include" >> "$GITHUB_ENV"
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true
      - name: Install Rust 1.95 (rust-version of the workspace)
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup override set 1.95
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: msrv
          # Only the default branch writes the cache; other branches and pull requests read it.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test (unit and integration)
        run: cargo test --locked --workspace --lib --bins

  e2e:
    name: End to end (real bubblewrap, TEST-010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config bubblewrap libudev-dev libxkbcommon-dev libwayland-dev libgl-dev xvfb xauth \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev libopus-dev libpulse-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev
          # bindgen must load the libclang installed above: the runner image ships other LLVM
          # versions whose libclang lacks its headers, which leaves FFmpeg's types empty.
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang -dumpversion | cut -d. -f1)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(clang -print-resource-dir)/include" >> "$GITHUB_ENV"
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bubblewrap
      # is not setuid there. The runner is a throw-away VM, so the restriction is lifted
      # for the job (users get an AppArmor profile instead, PKG-006).
      # Ubuntu also ships `bwrap-userns-restrict`, which lets bwrap make a namespace but
      # forbids everything inside it from making another, which is what Proton's container
      # needs (P-22). It is unloaded too.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
      - name: Probe bwrap --unshare-user, and a namespace inside it
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- true
          bwrap --unshare-user --ro-bind / / --proc /proc --dev /dev -- unshare --user --map-root-user true
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: e2e
          # Only the default branch writes the cache; other branches and pull requests read it.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # The umu experiments (crates/zaun/tests/e2e_experiments.rs, TEST-020) need a real
      # umu-run, Proton and the Steam Linux Runtime; they run on a developer host
      # (TESTING_STRATEGY §10.1) and skip here.
      # A game is only planned with a display to open its window on: an X server stands in.
      - name: e2e_sandbox, init shim, host probe, lifecycle, e2e_cli
        env:
          ZAUN_E2E: "1"
        run: |
          cargo test --locked -p zaun-init
          xvfb-run -a cargo test --locked -p zaun-core --test e2e_sandbox --test host_e2e \
            --test session_lifecycle
          xvfb-run -a cargo test --locked -p zaun --test e2e_cli -- --nocapture
      # The job pool has clamp(cores - 1, 2, 6) workers. On two CPUs both can be inside a
      # job that waits for another job of the pool (host probe, runtime rescan), which once
      # stalled every command; the runner's four CPUs never show that.
      - name: e2e_cli as a two-CPU machine runs it (smallest job pool)
        run: xvfb-run -a taskset -c 0,1 cargo test --locked -p zaun --test e2e_cli

  fuzz:
    name: Fuzz targets compile (SEC-004)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Check every target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  bench:
    name: Benchmarks (PERF-001)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl-dev
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: bench
          # Only the default branch writes the cache; other branches and pull requests read it.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Run the benches and the 25 % regression gate
        run: scripts/bench.sh bench-results.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-results
          path: bench-results.jsonl
          if-no-files-found: ignore

  coverage:
    name: Coverage report (informational)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libxkbcommon-dev libwayland-dev libgl-dev \
            mesa-vulkan-drivers libvulkan1 \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev libopus-dev libpulse-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev
          # bindgen must load the libclang installed above: the runner image ships other LLVM
          # versions whose libclang lacks its headers, which leaves FFmpeg's types empty.
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang -dumpversion | cut -d. -f1)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(clang -print-resource-dir)/include" >> "$GITHUB_ENV"
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@c2e5d2ce8920c881761c4cabb41434daa1f95687 # cargo-llvm-cov
      - name: Coverage of the workspace tests
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
