name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  # A release follows a green CI run of a push to the default branch, never a red one.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: "Force a release on the current branch"
        type: boolean
        default: false
      bump:
        description: "Bump kind when release is true (auto = derive from conventional commits)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: "Explicit version without the leading v; overrides bump"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{
      !startsWith(github.ref, 'refs/tags/')
      && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    }}

env:
  BIN_NAME: zaun
  INIT_NAME: zaun-init
  CARGO_TERM_COLOR: always
  # rusty_ffmpeg generates its bindings from the first include folder pkg-config reports, in
  # no set order; on Ubuntu that is sometimes not the one holding FFmpeg's headers.
  FFMPEG_INCLUDE_DIR: /usr/include/x86_64-linux-gnu

jobs:
  prepare-release:
    name: Prepare release version
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.release) ||
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == github.event.repository.default_branch
          && !startsWith(github.event.workflow_run.head_commit.message, 'chore: release v')
          && !contains(github.event.workflow_run.head_commit.message, '[skip release]'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve next version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Release versioning must run from a branch, not ${GITHUB_REF_TYPE}." >&2
            exit 1
          fi

          git fetch --tags --force

          # The version lives in [workspace.package] and is inherited by every crate.
          current="$(awk '
            $0 == "[workspace.package]" { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [[ -z "${current}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml." >&2
            exit 1
          fi

          bump_kind=""
          if [[ -n "${INPUT_VERSION}" ]]; then
            next="${INPUT_VERSION#v}"
            bump_kind="explicit"
          elif [[ "${INPUT_BUMP}" != "auto" ]]; then
            bump_kind="${INPUT_BUMP}"
          else
            last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
            if [[ -z "${last_tag}" ]]; then
              range="HEAD"
              echo "No previous release tag; scanning full history."
            else
              range="${last_tag}..HEAD"
              echo "Scanning commits in ${range}."
            fi

            # Conventional commits: feat: -> minor, fix:/perf: -> patch,
            # any "<type>!:" subject or "BREAKING CHANGE:" footer -> major.
            breaking_re='^[A-Za-z]+(\([^)]+\))?!:'
            feat_re='^feat(\([^)]+\))?:'
            fix_re='^(fix|perf)(\([^)]+\))?:'
            commits="$(git log --format='%H%x1f%B%x1e' "${range}" || true)"
            if [[ -n "${commits}" ]]; then
              while IFS= read -r -d $'\x1e' entry; do
                [[ -z "${entry}" ]] && continue
                subject="${entry#*$'\x1f'}"
                subject="${subject%%$'\n'*}"
                body="${entry#*$'\x1f'}"

                if [[ "${subject}" =~ $breaking_re ]] \
                   || grep -qE '^(BREAKING[ -]CHANGE):' <<<"${body}"; then
                  bump_kind="major"
                  break
                elif [[ "${subject}" =~ $feat_re ]]; then
                  [[ "${bump_kind}" != "major" ]] && bump_kind="minor"
                elif [[ "${subject}" =~ $fix_re ]]; then
                  [[ -z "${bump_kind}" ]] && bump_kind="patch"
                fi
              done <<<"${commits}"
            fi

            if [[ -z "${bump_kind}" ]]; then
              echo "No feat/fix/perf/breaking commits since ${last_tag:-the beginning}; skipping release."
              echo "released=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          if [[ -z "${next:-}" ]]; then
            if [[ ! "${current}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Automatic ${bump_kind} bump requires a plain MAJOR.MINOR.PATCH version; current is ${current}." >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            # 0.x: a breaking change bumps the minor, per RELEASE_STRATEGY §1.
            if [[ "${major}" == "0" && "${bump_kind}" == "major" ]]; then
              bump_kind="minor"
            fi

            case "${bump_kind}" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "Unknown bump kind: ${bump_kind}" >&2; exit 1 ;;
            esac

            next="${major}.${minor}.${patch}"
          fi

          if [[ ! "${next}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Cargo semver version: ${next}" >&2
            exit 1
          fi

          tag="v${next}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

          awk -v new_version="${next}" '
            $0 == "[workspace.package]" { in_package = 1 }
            in_package && $0 ~ /^version[[:space:]]*=/ && !done {
              sub(/"[^"]+"/, "\"" new_version "\"")
              done = 1
            }
            /^\[/ && $0 != "[workspace.package]" && in_package { in_package = 0 }
            { print }
            END { if (!done) exit 1 }
          ' Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml

          # Refresh only workspace members' versions in the lockfile.
          cargo update --workspace

          echo "Bumping ${current} -> ${next} (${bump_kind})"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "released=true" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump and tag
        id: commit
        if: ${{ steps.version.outputs.released == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git diff -- Cargo.toml Cargo.lock
          if [[ -n "$(git status --porcelain -- Cargo.toml Cargo.lock)" ]]; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Cargo.toml already at ${TAG#v}; tagging existing HEAD."
          fi
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and test (${{ matrix.target }})
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || (needs.prepare-release.result == 'skipped' && github.event_name != 'workflow_run')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            init_target: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config musl-tools bubblewrap zstd binutils desktop-file-utils appstream \
            libudev-dev libxkbcommon-dev libwayland-dev libgl-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev libopus-dev libpulse-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev
          # bindgen must load the libclang installed above: the runner image ships other LLVM
          # versions whose libclang lacks its headers, which leaves FFmpeg's types empty.
          echo "LIBCLANG_PATH=/usr/lib/llvm-$(clang -dumpversion | cut -d. -f1)/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(clang -print-resource-dir)/include" >> "$GITHUB_ENV"
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null || true

      # As in CI's end-to-end job: the e2e tests need a namespace inside the sandbox, which
      # Ubuntu's AppArmor restriction and its bwrap-userns-restrict profile forbid.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
          fi
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.init_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          shared-key: build
          cache-on-failure: true
          cache-all-crates: true
          # Pull requests read the cache but never write it (the 10 GB per repository).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Check formatting
        run: cargo fmt --all --check

      # The portable build's Debian 12 tools are too old for these files (ADR-0041).
      - name: Validate the desktop entry and AppStream metadata
        run: |
          desktop-file-validate assets/share/applications/*.desktop
          appstreamcli validate --no-net --explain assets/share/metainfo/*.metainfo.xml

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The UI's integration tests render with wgpu and need a GPU adapter; CI's UI job runs
      # them on a software one. Here they are left out, as in CI's MSRV job.
      - name: Test
        run: |
          cargo test --locked --workspace --exclude zaun-ui
          cargo test --locked -p zaun-ui --lib

  portable:
    # The release binaries (ADR-0041): built in Debian 12 so they start on any distribution
    # with glibc 2.35 or newer, with FFmpeg built in, the helpers and the Chat engine. The
    # tarball, every package and the self-update bundle come from this job.
    name: Portable build (Debian 12)
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || (needs.prepare-release.result == 'skipped' && github.event_name != 'workflow_run')) }}
    runs-on: ubuntu-latest
    container: docker.io/library/debian:12
    # Debian's `sh` is dash, which has no `pipefail` and no `${x:0:12}`.
    defaults:
      run:
        shell: bash
    env:
      ZAUN_PORTABLE_WORK: /work
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
      CARGO_TARGET_DIR: /work/target

    steps:
      - name: Install git and curl
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl zstd >/dev/null
          mkdir -p /work

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      # Before the cargo cache, whose key names the compiler.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --no-modify-path --profile minimal --default-toolchain none
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/rustup" toolchain install
          "${CARGO_HOME}/bin/rustc" --version

      - name: Cache FFmpeg and the pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /work/ffmpeg
            /work/src
          key: portable-sources-${{ hashFiles('packaging/portable/sources.sh', 'packaging/portable/build-ffmpeg.sh') }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: portable
          workspaces: ". -> /work/target"
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build, check and stage the tarball
        # packaging/portable/build.sh installs the build packages and the toolchain, builds
        # FFmpeg and takes the Chat engine from its pinned release, then runs
        # scripts/build-release.sh --tarball (PKG-001): --locked, no dev-inspection, size
        # budgets, static shim, desktop/AppStream validation.
        id: tarball
        env:
          ZAUN_COMMIT: ${{ needs.prepare-release.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          ZAUN_COMMIT="${ZAUN_COMMIT:0:12}" packaging/portable/build.sh
          version="$(cat dist/zaun-*-x86_64-linux/VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Start with an empty environment
        # As the session supervisor does; a library missing from Debian 12 fails here.
        run: env -i dist/zaun-*-x86_64-linux/libexec/zaun/zaun --version

      - name: Files of the self-update bundle (ADR-0041)
        # Each binary gzip-compressed, and the Chat engine as a GNU tar of plain files; the
        # release job lists and signs them in bundle.json (and zaun, zaun-init in the
        # manifest.json of older copies).
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          set -euo pipefail
          . packaging/portable/sources.sh
          tree="dist/zaun-${VERSION}-x86_64-linux"
          for name in zaun zaun-init zaun-overlay zaun-chat; do
            gzip -9 -n -c "${tree}/libexec/zaun/${name}" > "dist/zaun-${VERSION}-x86_64-linux.${name}.gz"
          done
          tar --format=gnu --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -C "${tree}/libexec/zaun/simplex" -cf - . \
            | gzip -9 -n > "dist/zaun-simplex-${SIMPLEX_VERSION}-x86_64.tar.gz"

      - name: Vendored crates for offline source builds (RPM/COPR)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.tarball.outputs.version }}
          COMMIT: ${{ needs.prepare-release.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME}/bin:${PATH}"
          cargo vendor --locked vendor > /dev/null
          echo "${COMMIT:0:12}" > vendor/COMMIT
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - vendor \
            | zstd -q -19 -T0 -o "dist/zaun-${VERSION}-vendor.tar.zst"
          rm -rf vendor

      - name: Upload release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarball
          path: |
            dist/zaun-${{ steps.tarball.outputs.version }}-x86_64-linux.tar.zst
            dist/zaun-${{ steps.tarball.outputs.version }}-x86_64-linux.*.gz
            dist/zaun-simplex-*-x86_64.tar.gz
            dist/zaun-${{ steps.tarball.outputs.version }}-vendor.tar.zst
          if-no-files-found: error

  packages:
    # Distribution packages from the release tarball, so every format ships the binaries that
    # build-release.sh checked (PKG-002/003/004, RELEASE_STRATEGY §2).
    name: Package (${{ matrix.format }})
    needs:
      - prepare-release
      - build
      - portable
    if: ${{ always() && needs.build.result == 'success' && needs.portable.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ""
          - format: rpm
            container: registry.fedoraproject.org/fedora:latest
          - format: arch
            container: archlinux:base-devel
    container: ${{ matrix.container || null }}

    steps:
      - name: Install packaging tools (Fedora)
        if: ${{ matrix.format == 'rpm' }}
        # The libraries %check's `zaun --version` loads.
        run: |
          dnf -y install git rpm-build rpmlint binutils zstd tar desktop-file-utils libappstream-glib \
            libva pipewire-libs pulseaudio-libs opus systemd-libs libstdc++ libxkbcommon

      - name: Install packaging tools (Arch)
        if: ${{ matrix.format == 'arch' }}
        run: pacman -Syu --noconfirm --needed git namcap zstd

      - name: Install packaging tools (Debian)
        if: ${{ matrix.format == 'deb' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian zstd binutils

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Download release tarball
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-tarball
          path: dist

      - name: Unpack
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls dist/zaun-*-x86_64-linux.tar.zst)"
          tar --zstd -xf "${archive}" -C dist
          version="$(cat dist/zaun-*-x86_64-linux/VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tree=$(ls -d "${PWD}"/dist/zaun-*-x86_64-linux)" >> "${GITHUB_OUTPUT}"
          mkdir -p out

      - name: Build .deb
        if: ${{ matrix.format == 'deb' }}
        run: |
          set -euo pipefail
          packaging/deb/build-deb.sh --from-tarball "${{ steps.unpack.outputs.tree }}" --out out
          dpkg-deb --info out/*.deb
          lintian --fail-on error --display-info out/*.deb

      - name: Build .rpm
        if: ${{ matrix.format == 'rpm' }}
        shell: bash
        env:
          VERSION: ${{ steps.unpack.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^%global upstream_version .*/%global upstream_version ${VERSION}/" packaging/rpm/zaun.spec
          rpmbuild -bb --with prebuilt \
            --define "_sourcedir ${PWD}/dist" --define "_rpmdir ${PWD}/out" \
            --define "_build_name_fmt %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm" \
            packaging/rpm/zaun.spec
          # -c: the TOML file is configuration (its Filters); -r would read it as an rpmlintrc.
          rpmlint -c packaging/rpm/rpmlintrc.toml packaging/rpm/zaun.spec out/*.rpm

      - name: Build Arch package (zaun-bin)
        if: ${{ matrix.format == 'arch' }}
        shell: bash
        env:
          VERSION: ${{ steps.unpack.outputs.version }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root.
          useradd -m builder
          work=/home/builder/zaun-bin
          mkdir -p "${work}"
          cp packaging/arch/zaun-bin/PKGBUILD "${work}/"
          cp dist/zaun-*-x86_64-linux.tar.zst "${work}/"
          sum="$(sha256sum dist/zaun-*-x86_64-linux.tar.zst | cut -d' ' -f1)"
          # pacman versions cannot contain "-": 1.0.0-rc.1 -> 1.0.0rc.1.
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION//-/}/" \
                 -e "s/^_upstreamver=.*/_upstreamver=${VERSION}/" \
                 -e "s/^sha256sums=.*/sha256sums=('${sum}')/" "${work}/PKGBUILD"
          chown -R builder: "${work}"
          su builder -c "cd ${work} && makepkg --nodeps --noconfirm --cleanbuild && makepkg --printsrcinfo > .SRCINFO"
          namcap "${work}/PKGBUILD"
          namcap "${work}"/*.pkg.tar.zst
          cp "${work}"/*.pkg.tar.zst out/
          cp "${work}/PKGBUILD" out/PKGBUILD-zaun-bin
          cp "${work}/.SRCINFO" out/SRCINFO-zaun-bin

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.format }}
          path: out/*
          if-no-files-found: error

  nix:
    name: Nix flake build
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || (needs.prepare-release.result == 'skipped' && github.event_name != 'workflow_run')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          save: ${{ github.event_name != 'pull_request' }}
      - name: Build package
        run: nix build -L .#zaun

      - name: Check dev shell
        run: nix develop -c cargo --version

  release:
    name: GitHub release
    if: ${{ always() && needs.build.result == 'success' && needs.portable.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true') }}
    needs:
      - prepare-release
      - build
      - portable
      - packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          # The tarball always; each distribution package when its job succeeded.
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Signed update manifests (ADR-0040, ADR-0041)
        # bundle.json (and manifest.json for older copies) list the update files with their
        # sizes and SHA-256 sums and are signed with the release key; the app trusts only the
        # public key compiled into it. The key reaches this step only, through the
        # ZAUN_UPDATE_SIGNING_KEY secret.
        env:
          ZAUN_RELEASE_KEY_PEM: ${{ secrets.ZAUN_UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${ZAUN_RELEASE_KEY_PEM}" ]]; then
            echo "::error::The ZAUN_UPDATE_SIGNING_KEY secret is not set; no update manifest can be signed."
            exit 1
          fi
          scripts/sign-release-manifest.sh --version "${TAG#v}" --dir dist --arch x86_64

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          # A pre-release (v1.0.0-rc.1) is never "latest", so installed copies are not offered it.
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes "${prerelease[@]}"
          fi
