name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Force a release on the current branch"
        type: boolean
        default: false
      bump:
        description: "Bump kind when release is true (auto = derive from conventional commits)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: "Explicit version without the leading v; overrides bump"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{
      !startsWith(github.ref, 'refs/tags/')
      && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    }}

env:
  BIN_NAME: easyplay
  INIT_NAME: easyplay-init
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare release version
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.release) ||
        (github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && !startsWith(github.event.head_commit.message, 'chore: release v')
          && !contains(github.event.head_commit.message, '[skip release]'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve next version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Release versioning must run from a branch, not ${GITHUB_REF_TYPE}." >&2
            exit 1
          fi

          git fetch --tags --force

          # The version lives in [workspace.package] and is inherited by every crate.
          current="$(awk '
            $0 == "[workspace.package]" { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [[ -z "${current}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml." >&2
            exit 1
          fi

          bump_kind=""
          if [[ -n "${INPUT_VERSION}" ]]; then
            next="${INPUT_VERSION#v}"
            bump_kind="explicit"
          elif [[ "${INPUT_BUMP}" != "auto" ]]; then
            bump_kind="${INPUT_BUMP}"
          else
            last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
            if [[ -z "${last_tag}" ]]; then
              range="HEAD"
              echo "No previous release tag; scanning full history."
            else
              range="${last_tag}..HEAD"
              echo "Scanning commits in ${range}."
            fi

            # Conventional commits: feat: -> minor, fix:/perf: -> patch,
            # any "<type>!:" subject or "BREAKING CHANGE:" footer -> major.
            breaking_re='^[A-Za-z]+(\([^)]+\))?!:'
            feat_re='^feat(\([^)]+\))?:'
            fix_re='^(fix|perf)(\([^)]+\))?:'
            commits="$(git log --format='%H%x1f%B%x1e' "${range}" || true)"
            if [[ -n "${commits}" ]]; then
              while IFS= read -r -d $'\x1e' entry; do
                [[ -z "${entry}" ]] && continue
                subject="${entry#*$'\x1f'}"
                subject="${subject%%$'\n'*}"
                body="${entry#*$'\x1f'}"

                if [[ "${subject}" =~ $breaking_re ]] \
                   || grep -qE '^(BREAKING[ -]CHANGE):' <<<"${body}"; then
                  bump_kind="major"
                  break
                elif [[ "${subject}" =~ $feat_re ]]; then
                  [[ "${bump_kind}" != "major" ]] && bump_kind="minor"
                elif [[ "${subject}" =~ $fix_re ]]; then
                  [[ -z "${bump_kind}" ]] && bump_kind="patch"
                fi
              done <<<"${commits}"
            fi

            if [[ -z "${bump_kind}" ]]; then
              echo "No feat/fix/perf/breaking commits since ${last_tag:-the beginning}; skipping release."
              echo "released=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          if [[ -z "${next:-}" ]]; then
            if [[ ! "${current}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Automatic ${bump_kind} bump requires a plain MAJOR.MINOR.PATCH version; current is ${current}." >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            # 0.x: a breaking change bumps the minor, per RELEASE_STRATEGY §1.
            if [[ "${major}" == "0" && "${bump_kind}" == "major" ]]; then
              bump_kind="minor"
            fi

            case "${bump_kind}" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "Unknown bump kind: ${bump_kind}" >&2; exit 1 ;;
            esac

            next="${major}.${minor}.${patch}"
          fi

          if [[ ! "${next}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Cargo semver version: ${next}" >&2
            exit 1
          fi

          tag="v${next}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

          awk -v new_version="${next}" '
            $0 == "[workspace.package]" { in_package = 1 }
            in_package && $0 ~ /^version[[:space:]]*=/ && !done {
              sub(/"[^"]+"/, "\"" new_version "\"")
              done = 1
            }
            /^\[/ && $0 != "[workspace.package]" && in_package { in_package = 0 }
            { print }
            END { if (!done) exit 1 }
          ' Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml

          # Refresh only workspace members' versions in the lockfile.
          cargo update --workspace

          echo "Bumping ${current} -> ${next} (${bump_kind})"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "released=true" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump and tag
        id: commit
        if: ${{ steps.version.outputs.released == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git diff -- Cargo.toml Cargo.lock
          if [[ -n "$(git status --porcelain -- Cargo.toml Cargo.lock)" ]]; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Cargo.toml already at ${TAG#v}; tagging existing HEAD."
          fi
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and test (${{ matrix.target }})
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            init_target: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config musl-tools bubblewrap zstd binutils desktop-file-utils appstream \
            libudev-dev libxkbcommon-dev libwayland-dev libgl-dev

      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.init_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: build
          cache-on-failure: true
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Release build, checks and tarball
        # scripts/build-release.sh (PKG-001): --locked, no dev-inspection, size budgets of
        # PERFORMANCE §1, static shim, desktop/AppStream validation, staged tarball (PKG-007).
        id: tarball
        env:
          EASYPLAY_COMMIT: ${{ needs.prepare-release.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          EASYPLAY_COMMIT="${EASYPLAY_COMMIT:0:12}" scripts/build-release.sh --tarball
          version="$(cat dist/easyplay-*-x86_64-linux/VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Vendored crates for offline source builds (RPM/COPR)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.tarball.outputs.version }}
          COMMIT: ${{ needs.prepare-release.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          cargo vendor --locked vendor > /dev/null
          echo "${COMMIT:0:12}" > vendor/COMMIT
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -cf - vendor \
            | zstd -q -19 -T0 -o "dist/easyplay-${VERSION}-vendor.tar.zst"
          rm -rf vendor

      - name: Upload release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            dist/easyplay-${{ steps.tarball.outputs.version }}-x86_64-linux.tar.zst
            dist/easyplay-${{ steps.tarball.outputs.version }}-vendor.tar.zst
          if-no-files-found: error

  packages:
    # Distribution packages from the release tarball, so every format ships the binaries that
    # build-release.sh checked (PKG-002/003/004, RELEASE_STRATEGY §2).
    name: Package (${{ matrix.format }})
    needs:
      - prepare-release
      - build
    if: ${{ always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ""
          - format: rpm
            container: fedora:latest
          - format: arch
            container: archlinux:base-devel
    container: ${{ matrix.container || null }}

    steps:
      - name: Install packaging tools (Fedora)
        if: ${{ matrix.format == 'rpm' }}
        run: dnf -y install git rpm-build rpmlint binutils zstd tar desktop-file-utils libappstream-glib

      - name: Install packaging tools (Arch)
        if: ${{ matrix.format == 'arch' }}
        run: pacman -Syu --noconfirm --needed git namcap zstd

      - name: Install packaging tools (Debian)
        if: ${{ matrix.format == 'deb' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian zstd binutils

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Download release tarball
        uses: actions/download-artifact@v5
        with:
          name: release-tarball
          path: dist

      - name: Unpack
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls dist/easyplay-*-x86_64-linux.tar.zst)"
          tar --zstd -xf "${archive}" -C dist
          version="$(cat dist/easyplay-*-x86_64-linux/VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tree=$(ls -d "${PWD}"/dist/easyplay-*-x86_64-linux)" >> "${GITHUB_OUTPUT}"
          mkdir -p out

      - name: Build .deb
        if: ${{ matrix.format == 'deb' }}
        run: |
          set -euo pipefail
          packaging/deb/build-deb.sh --from-tarball "${{ steps.unpack.outputs.tree }}" --out out
          dpkg-deb --info out/*.deb
          lintian --fail-on error --display-info out/*.deb

      - name: Build .rpm
        if: ${{ matrix.format == 'rpm' }}
        shell: bash
        env:
          VERSION: ${{ steps.unpack.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^%global upstream_version .*/%global upstream_version ${VERSION}/" packaging/rpm/easyplay.spec
          rpmbuild -bb --with prebuilt \
            --define "_sourcedir ${PWD}/dist" --define "_rpmdir ${PWD}/out" \
            --define "_build_name_fmt %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm" \
            packaging/rpm/easyplay.spec
          rpmlint -r packaging/rpm/rpmlintrc.toml packaging/rpm/easyplay.spec out/*.rpm

      - name: Build Arch package (easyplay-bin)
        if: ${{ matrix.format == 'arch' }}
        shell: bash
        env:
          VERSION: ${{ steps.unpack.outputs.version }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root.
          useradd -m builder
          work=/home/builder/easyplay-bin
          mkdir -p "${work}"
          cp packaging/arch/easyplay-bin/PKGBUILD "${work}/"
          cp dist/easyplay-*-x86_64-linux.tar.zst "${work}/"
          sum="$(sha256sum dist/easyplay-*-x86_64-linux.tar.zst | cut -d' ' -f1)"
          # pacman versions cannot contain "-": 1.0.0-rc.1 -> 1.0.0rc.1.
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION//-/}/" \
                 -e "s/^_upstreamver=.*/_upstreamver=${VERSION}/" \
                 -e "s/^sha256sums=.*/sha256sums=('${sum}')/" "${work}/PKGBUILD"
          chown -R builder: "${work}"
          su builder -c "cd ${work} && makepkg --nodeps --noconfirm --cleanbuild && makepkg --printsrcinfo > .SRCINFO"
          namcap "${work}/PKGBUILD"
          namcap "${work}"/*.pkg.tar.zst
          cp "${work}"/*.pkg.tar.zst out/
          cp "${work}/PKGBUILD" out/PKGBUILD-easyplay-bin
          cp "${work}/.SRCINFO" out/SRCINFO-easyplay-bin

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.format }}
          path: out/*
          if-no-files-found: error

  nix:
    name: Nix flake build
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build -L .#easyplay

      - name: Check dev shell
        run: nix develop -c cargo --version

  release:
    name: GitHub release
    if: ${{ always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true') }}
    needs:
      - prepare-release
      - build
      - packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          # The tarball always; each distribution package when its job succeeded.
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          fi
