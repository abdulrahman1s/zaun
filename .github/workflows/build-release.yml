name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Force a release on the current branch"
        type: boolean
        default: false
      bump:
        description: "Bump kind when release is true (auto = derive from conventional commits)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: "Explicit version without the leading v; overrides bump"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{
      !startsWith(github.ref, 'refs/tags/')
      && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    }}

env:
  BIN_NAME: easyplay
  INIT_NAME: easyplay-init
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare release version
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.release) ||
        (github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && !startsWith(github.event.head_commit.message, 'chore: release v')
          && !contains(github.event.head_commit.message, '[skip release]'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve next version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Release versioning must run from a branch, not ${GITHUB_REF_TYPE}." >&2
            exit 1
          fi

          git fetch --tags --force

          # The version lives in [workspace.package] and is inherited by every crate.
          current="$(awk '
            $0 == "[workspace.package]" { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [[ -z "${current}" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml." >&2
            exit 1
          fi

          bump_kind=""
          if [[ -n "${INPUT_VERSION}" ]]; then
            next="${INPUT_VERSION#v}"
            bump_kind="explicit"
          elif [[ "${INPUT_BUMP}" != "auto" ]]; then
            bump_kind="${INPUT_BUMP}"
          else
            last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
            if [[ -z "${last_tag}" ]]; then
              range="HEAD"
              echo "No previous release tag; scanning full history."
            else
              range="${last_tag}..HEAD"
              echo "Scanning commits in ${range}."
            fi

            # Conventional commits: feat: -> minor, fix:/perf: -> patch,
            # any "<type>!:" subject or "BREAKING CHANGE:" footer -> major.
            breaking_re='^[A-Za-z]+(\([^)]+\))?!:'
            feat_re='^feat(\([^)]+\))?:'
            fix_re='^(fix|perf)(\([^)]+\))?:'
            commits="$(git log --format='%H%x1f%B%x1e' "${range}" || true)"
            if [[ -n "${commits}" ]]; then
              while IFS= read -r -d $'\x1e' entry; do
                [[ -z "${entry}" ]] && continue
                subject="${entry#*$'\x1f'}"
                subject="${subject%%$'\n'*}"
                body="${entry#*$'\x1f'}"

                if [[ "${subject}" =~ $breaking_re ]] \
                   || grep -qE '^(BREAKING[ -]CHANGE):' <<<"${body}"; then
                  bump_kind="major"
                  break
                elif [[ "${subject}" =~ $feat_re ]]; then
                  [[ "${bump_kind}" != "major" ]] && bump_kind="minor"
                elif [[ "${subject}" =~ $fix_re ]]; then
                  [[ -z "${bump_kind}" ]] && bump_kind="patch"
                fi
              done <<<"${commits}"
            fi

            if [[ -z "${bump_kind}" ]]; then
              echo "No feat/fix/perf/breaking commits since ${last_tag:-the beginning}; skipping release."
              echo "released=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          if [[ -z "${next:-}" ]]; then
            if [[ ! "${current}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Automatic ${bump_kind} bump requires a plain MAJOR.MINOR.PATCH version; current is ${current}." >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            # 0.x: a breaking change bumps the minor, per RELEASE_STRATEGY §1.
            if [[ "${major}" == "0" && "${bump_kind}" == "major" ]]; then
              bump_kind="minor"
            fi

            case "${bump_kind}" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "Unknown bump kind: ${bump_kind}" >&2; exit 1 ;;
            esac

            next="${major}.${minor}.${patch}"
          fi

          if [[ ! "${next}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Cargo semver version: ${next}" >&2
            exit 1
          fi

          tag="v${next}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

          awk -v new_version="${next}" '
            $0 == "[workspace.package]" { in_package = 1 }
            in_package && $0 ~ /^version[[:space:]]*=/ && !done {
              sub(/"[^"]+"/, "\"" new_version "\"")
              done = 1
            }
            /^\[/ && $0 != "[workspace.package]" && in_package { in_package = 0 }
            { print }
            END { if (!done) exit 1 }
          ' Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml

          # Refresh only workspace members' versions in the lockfile.
          cargo update --workspace

          echo "Bumping ${current} -> ${next} (${bump_kind})"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "released=true" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump and tag
        id: commit
        if: ${{ steps.version.outputs.released == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git diff -- Cargo.toml Cargo.lock
          if [[ -n "$(git status --porcelain -- Cargo.toml Cargo.lock)" ]]; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Cargo.toml already at ${TAG#v}; tagging existing HEAD."
          fi
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and test (${{ matrix.target }})
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            init_target: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config musl-tools bubblewrap zstd \
            libudev-dev libxkbcommon-dev libwayland-dev libgl-dev

      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.init_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: build
          cache-on-failure: true
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build release binaries
        env:
          EASYPLAY_LIBEXEC_DIR: /usr/libexec/easyplay
        run: |
          cargo build --locked --release -p easyplay --target ${{ matrix.target }}
          cargo build --locked --release -p easyplay-init --target ${{ matrix.init_target }}

      - name: Package release tarball
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          root="dist/${BIN_NAME}-${RELEASE_TAG}"
          mkdir -p "${root}/bin" "${root}/libexec/easyplay" "${root}/share"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${root}/bin/"
          cp "target/${{ matrix.init_target }}/release/${INIT_NAME}" "${root}/libexec/easyplay/"
          if [[ -d assets/share ]]; then cp -r assets/share/. "${root}/share/"; fi
          if [[ -d packaging/tarball ]]; then cp packaging/tarball/*.sh "${root}/" 2>/dev/null || true; fi
          cp README.md "${root}/"
          archive="${BIN_NAME}-${RELEASE_TAG}-${{ matrix.target }}.tar.zst"
          tar -C dist -c "${BIN_NAME}-${RELEASE_TAG}" | zstd -19 -T0 -o "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ needs.prepare-release.outputs.tag || github.ref_name }}-${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ needs.prepare-release.outputs.tag || github.ref_name }}-${{ matrix.target }}.tar.zst
            ${{ env.BIN_NAME }}-${{ needs.prepare-release.outputs.tag || github.ref_name }}-${{ matrix.target }}.tar.zst.sha256
          if-no-files-found: error

  nix:
    name: Nix flake build
    needs:
      - prepare-release
    if: ${{ always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build -L .#easyplay

      - name: Check dev shell
        run: nix develop -c cargo --version

  release:
    name: GitHub release
    if: ${{ always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.prepare-release.outputs.released == 'true') }}
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: ${{ env.BIN_NAME }}-${{ needs.prepare-release.outputs.tag || github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          fi
