# rpmlint configuration for zaun.spec (PKG-003).
Filters = [
    # The in-sandbox init shim is static on purpose (ARCHITECTURE §12): it is bind-mounted
    # into every sandbox and must not depend on the sandbox's libraries.
    "statically-linked-binary",
    # FFmpeg's licence text as FFmpeg ships it, with the FSF's old postal address.
    "incorrect-fsf-address .*/licenses/zaun/LGPL-2.1-FFmpeg.txt",
    # Names, not misspellings.
    "spelling-error .*'(umu|exe|bubblewrap)'",
    # Loaded with dlopen, so the dependency is listed by hand.
    "explicit-lib-dependency libxkbcommon",
]
