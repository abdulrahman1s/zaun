[package]
name = "easyplay-overlay"
description = "EasyPlay's in-game overlay: a wlr-layer-shell surface drawn with egui, spoken to over stdin/stdout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "easyplay-overlay"
path = "src/main.rs"

# ADR-0037. The egui family is pinned with `=` like the workspace's; everything else is
# already in the tree through eframe/winit (same major versions).
[dependencies]
easyplay-core = { workspace = true }
# The app's catalogue, palette, typography, icons and bidirectional text (ADR-0037 §6):
# the overlay speaks and looks like the window, from one source.
easyplay-ui = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
egui-wgpu = "=0.37.0"
wgpu = "30.0"
pollster = "1.0"
# The layer shell and the seat; `xkbcommon` turns key codes into keys and text.
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { workspace = true }
# `client_system`: wgpu needs libwayland's own display and surface pointers.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
raw-window-handle = "0.6"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
