# easyplay-core: the workspace list plus `std::fs`, which only `fsx` may use (ARCH-002).
# Keep the first three entries in sync with the workspace clippy.toml.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "use crate::clock::Clock (MODULES §2 clock)" },
    { path = "std::time::Instant::now", reason = "use crate::clock::Clock (MODULES §2 clock)" },
    { path = "std::process::Command::new", reason = "processes are started only by host::runner and session::spawn (ARCH-002; session::spawn also starts the Friends helper, ADR-0033)" },
    { path = "std::fs::read", reason = "use crate::fsx::Fs" },
    { path = "std::fs::read_to_string", reason = "use crate::fsx::Fs" },
    { path = "std::fs::write", reason = "use crate::fsx::Fs" },
    { path = "std::fs::read_dir", reason = "use crate::fsx::Fs" },
    { path = "std::fs::metadata", reason = "use crate::fsx::Fs" },
    { path = "std::fs::symlink_metadata", reason = "use crate::fsx::Fs" },
    { path = "std::fs::read_link", reason = "use crate::fsx::Fs" },
    { path = "std::fs::canonicalize", reason = "use crate::fsx::Fs" },
    { path = "std::fs::create_dir", reason = "use crate::fsx::Fs" },
    { path = "std::fs::create_dir_all", reason = "use crate::fsx::Fs" },
    { path = "std::fs::remove_file", reason = "use crate::fsx::Fs" },
    { path = "std::fs::remove_dir", reason = "use crate::fsx::Fs" },
    { path = "std::fs::remove_dir_all", reason = "use crate::fsx::safe_remove_tree" },
    { path = "std::fs::rename", reason = "use crate::fsx::Fs" },
    { path = "std::fs::copy", reason = "use crate::fsx::Fs" },
    { path = "std::fs::set_permissions", reason = "use crate::fsx::Fs" },
    { path = "std::fs::File::open", reason = "use crate::fsx::Fs" },
    { path = "std::fs::File::create", reason = "use crate::fsx::Fs" },
    { path = "std::fs::OpenOptions::open", reason = "use crate::fsx::Fs" },
]
