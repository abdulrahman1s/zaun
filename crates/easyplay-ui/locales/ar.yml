# Arabic catalogue of the EasyPlay interface (ADR-0032). Modern Standard Arabic, plain and
# calm, as short as the English. Every key of en.yml has a key here with the same %{...}
# arguments; plural families list the forms Arabic needs (zero, one, two, few, many, other).
#
# Glossary (keep to it):
#   game لعبة · library المكتبة · protection الحماية · Offline بلا إنترنت · Online متصل بالإنترنت
#   Standard قياسي · Custom مخصّص · compatibility layer طبقة التوافق · launch options خيارات التشغيل
#   Play تشغيل · Stop إيقاف · Add game إضافة لعبة · Settings الإعدادات · Statistics الإحصاءات
#   cover الغلاف · tag وسم · favourite مفضّلة · Windows storage تخزين ويندوز
#   sandbox / protected space مساحة محمية · permission إذن · folder مجلد · program برنامج
#   session جلسة · playtime مدة اللعب · artwork الصور · system check فحص النظام · backup نسخة احتياطية
# Product and technical names stay in Latin script: EasyPlay, Steam, Proton, Wine, Vulkan,
# OpenGL, X11, Wayland, MangoHud, file names, error codes. Digits are Western (0-9).
# The security wording rule holds here as in English: never promise complete safety.
