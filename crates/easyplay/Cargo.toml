[package]
name = "easyplay"
description = "Run Windows games through umu-run inside a per-game bubblewrap sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "easyplay"
path = "src/main.rs"

[features]
default = ["gamepad", "seccomp", "wayland-security-context", "portal", "hwenc"]
gamepad = ["easyplay-ui/gamepad"]
seccomp = ["easyplay-core/seccomp"]
wayland-security-context = ["easyplay-core/wayland-security-context"]
dev-inspection = ["easyplay-ui/dev-inspection"]
# Share a game's window through the ScreenCast portal and PipeWire (ADR-0036). Building it
# needs libpipewire and libclang (the dev shell and nix/package.nix provide both).
portal = ["easyplay-media/portal"]
# Encode shared games on the GPU (NVENC, VA-API) through FFmpeg 8's libavcodec (ADR-0036).
hwenc = ["easyplay-media/hwenc"]

[dependencies]
easyplay-core.workspace = true
easyplay-ui = { workspace = true, default-features = false }
# Calls' media (ADR-0035): WebRTC, Opus, PulseAudio.
easyplay-media.workspace = true
clap.workspace = true
signal-hook.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
rustix.workspace = true
sha2.workspace = true
clap_mangen.workspace = true
clap_complete.workspace = true
wayland-sys.workspace = true
x11-dl.workspace = true
xkbcommon-dl.workspace = true
zbus.workspace = true

[dev-dependencies]
easyplay-testkit.workspace = true
egui_kittest = { workspace = true, features = ["eframe"] }
tempfile.workspace = true
insta.workspace = true

[lints]
workspace = true
