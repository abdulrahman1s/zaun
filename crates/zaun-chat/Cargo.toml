[package]
name = "zaun-chat"
description = "Zaun's Chat helper: the simplex-client engine behind stdin/stdout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The engine (simplex-client) is ported from simplexmq and simplex-chat (AGPL-3.0), so the helper
# is distributed under the AGPL; Zaun itself stays GPL-3.0-or-later and only talks to it over pipes (ADR-0042).
license = "AGPL-3.0-only"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zaun-chat"
path = "src/main.rs"

# Only the wire crate from the workspace (ADR-0042): Zaun's neutral vocabulary on the pipe. The
# engine itself is the simplex-client crate, extracted from this helper and kept there.
[dependencies]
zaun-chat-wire = { path = "../zaun-chat-wire" }
simplex-client = { git = "https://github.com/abdulrahman1s/simplex-client", tag = "v0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
rustix.workspace = true

[lints]
workspace = true
