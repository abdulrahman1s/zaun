[package]
name = "zaun-chat"
description = "Zaun's Chat helper: hosts the SimpleX chat engine (libsimplex) behind stdin/stdout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The helper loads libsimplex (AGPL-3.0) into its process, so it is distributed under the
# AGPL; Zaun itself stays GPL-3.0-or-later and only talks to it over pipes (ADR-0033).
license = "AGPL-3.0-only"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "zaun-chat"
path = "src/main.rs"

# No workspace crate (ADR-0033): the helper is a pipe to the engine and nothing else.
[dependencies]
libloading = "0.8.9"
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
