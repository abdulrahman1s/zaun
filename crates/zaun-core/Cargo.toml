[package]
name = "zaun-core"
description = "Zaun core: domain model, storage, sandbox planning, launching (no UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["seccomp", "wayland-security-context"]
# Build the seccomp BPF program (BUBBLEWRAP_SANDBOX §9); on by default since milestone 15.
seccomp = ["dep:seccompiler"]
# Give each session a restricted Wayland socket through the compositor's
# `wp_security_context_v1` (ADR-0029). Without it every game gets the compositor's own socket.
wayland-security-context = ["dep:wayland-client", "dep:wayland-protocols"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
sha2.workspace = true
uuid.workspace = true
jiff.workspace = true
rustix.workspace = true
image.workspace = true
pelite.workspace = true
unicode-normalization.workspace = true
bitflags.workspace = true
strum.workspace = true
smallvec.workspace = true
base64.workspace = true
lz-str.workspace = true
flate2.workspace = true
ring.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
notify-rust.workspace = true
ormlite.workspace = true
tokio.workspace = true
libsqlite3-sys.workspace = true
ureq.workspace = true
seccompiler = { workspace = true, optional = true }
# The restricted Wayland socket (`host::wayland`); already in the tree through eframe.
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
# The supervisor's signal handling and the `unsafe` syscalls of `session::sys`.
signal-hook.workspace = true
libc.workspace = true

[dev-dependencies]
zaun-testkit.workspace = true
tempfile.workspace = true
insta.workspace = true
proptest.workspace = true

# PERFORMANCE §1 budgets (PERF-001): `cargo bench -p zaun-core`.
[[bench]]
name = "library"
harness = false

[[bench]]
name = "stats"
harness = false

[[bench]]
name = "planning"
harness = false

[lints]
workspace = true
